[project]
name = "fraudguard-m1-m2"
version = "0.1.0"
description = "FraudGuard 360 - Threat Intelligence & Synthetic Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",          # Added for Parquet saving
    "httpx>=0.27.0",            # Added for M2 calling M1 API
    "python-dotenv>=1.0.0",     # Added for loading .env files
    "langgraph>=0.1.0",         # Added for LLM Agent
    "langchain-core>=0.1.0",
    # LLM Providers (Optional, uncomment the one you use)
    # "langchain-openai>=0.1.0",
    # "langchain-anthropic>=0.1.0",
    # "langchain-google-genai>=1.0.0",
    # "langchain-groq>=0.1.0",
    # Advanced ML/Generators (Stretch goals)
    "scikit-learn>=1.5.0",
    "sdv>=1.10.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]