[project]
name = "fraudguard-m1-m2"
version = "0.1.0"
description = "FraudGuard 360 - Threat Intelligence & Synthetic Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-groq>=0.1.0",   # UNCOMMENTED
    "scikit-learn>=1.5.0",
    "sdv>=1.10.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "scipy>=1.10.0",
    
]

[tool.setuptools.packages.find]
include = ["apps*", "shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]